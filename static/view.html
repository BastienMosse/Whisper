<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whisper - Secret</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="page">
        <a href="/" class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <h1>Whisper</h1>
        </a>
        <p class="tagline">Un secret vous a été partagé</p>

        <div id="loading" class="card fade-up">
            <div class="spinner"></div>
        </div>

        <div id="not-found" class="card fade-up hidden">
            <div class="state-icon warn">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
            </div>
            <p class="state-title">Secret introuvable</p>
            <p class="state-sub">Ce secret a été supprimé, a expiré, ou n'existe pas.</p>
            <a href="/" style="text-decoration:none"><button class="btn-secondary">Créer un secret</button></a>
        </div>

        <div id="password-view" class="card fade-up hidden">
            <div class="state-icon lock">
                <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <p class="state-title">Secret protégé</p>
            <p class="state-sub">Entrez le mot de passe pour révéler le secret</p>

            <div class="meta-row">
                <span class="meta-tag">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    <span id="meta-time-pw"></span>
                </span>
                <span class="meta-tag">
                    <svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7"/><circle cx="12" cy="12" r="3"/></svg>
                    <span id="meta-views-pw"></span>
                </span>
            </div>

            <input type="password" id="pwd-input" placeholder="Mot de passe">
            <p class="error-msg" id="pwd-error">Mot de passe incorrect</p>
            <button class="btn-primary" id="pwd-btn" onclick="revealWithPassword()">Révéler le secret</button>
        </div>

        <div id="confirm-view" class="card fade-up hidden">
            <div class="state-icon lock">
                <svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
            <p class="state-title">Secret prêt</p>
            <p class="state-sub">L'afficher consommera une vue</p>

            <div class="meta-row">
                <span class="meta-tag">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    <span id="meta-time-cf"></span>
                </span>
                <span class="meta-tag">
                    <svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7"/><circle cx="12" cy="12" r="3"/></svg>
                    <span id="meta-views-cf"></span>
                </span>
            </div>

            <button class="btn-primary" onclick="revealSecret()">Révéler le secret</button>
        </div>

        <div id="secret-view" class="card fade-up hidden">
            <div class="warning-bar">
                <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <span id="remaining-text"></span>
            </div>

            <div class="secret-box" id="secret-content"></div>

            <div class="copy-row">
                <button class="copy-btn" id="copy-secret" onclick="copySecret()">
                    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    Copier
                </button>
            </div>

            <a href="/" style="text-decoration:none"><button class="btn-secondary">Créer un secret</button></a>
        </div>

        <p class="footer"><a href="https://lucipher-lab.fr">lucipher-lab</a></p>
    </div>

    <script>
        const secretId = window.location.pathname.split('/secret/')[1]?.split('/')[0]?.split('?')[0];

        function timeLeft(expiresAt) {
            const diff = expiresAt - Math.floor(Date.now() / 1000);
            if (diff <= 0) return 'Expiré';
            if (diff < 60) return diff + 's restantes';
            if (diff < 3600) return Math.floor(diff / 60) + 'min restantes';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h restantes';
            return Math.floor(diff / 86400) + 'j restants';
        }

        function showView(id) {
            ['loading', 'not-found', 'password-view', 'confirm-view', 'secret-view'].forEach(v => {
                document.getElementById(v).classList.toggle('hidden', v !== id);
            });
        }

        async function init() {
            if (!secretId) { showView('not-found'); return; }
            try {
                const r = await fetch('/api/secrets/' + secretId + '/info');
                if (!r.ok) { showView('not-found'); return; }
                const info = await r.json();

                if (info.has_password) {
                    document.getElementById('meta-time-pw').textContent = timeLeft(info.expires_at);
                    document.getElementById('meta-views-pw').textContent = info.remaining_views + ' vue' + (info.remaining_views > 1 ? 's' : '') + ' restante' + (info.remaining_views > 1 ? 's' : '');
                    showView('password-view');
                    document.getElementById('pwd-input').focus();
                } else {
                    document.getElementById('meta-time-cf').textContent = timeLeft(info.expires_at);
                    document.getElementById('meta-views-cf').textContent = info.remaining_views + ' vue' + (info.remaining_views > 1 ? 's' : '') + ' restante' + (info.remaining_views > 1 ? 's' : '');
                    showView('confirm-view');
                }
            } catch {
                showView('not-found');
            }
        }

        async function revealSecret(password) {
            try {
                const r = await fetch('/api/secrets/' + secretId, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password || '' }),
                });
                if (r.status === 403) return 'wrong_password';
                if (!r.ok) { showView('not-found'); return; }

                const data = await r.json();
                document.getElementById('secret-content').textContent = data.content;

                if (data.remaining_views <= 0) {
                    document.getElementById('remaining-text').textContent = 'Ce secret vient d\'être supprimé après la dernière vue';
                } else {
                    document.getElementById('remaining-text').textContent = data.remaining_views + ' vue' + (data.remaining_views > 1 ? 's' : '') + ' restante' + (data.remaining_views > 1 ? 's' : '') + ' avant suppression';
                }
                showView('secret-view');
            } catch {
                showView('not-found');
            }
        }

        async function revealWithPassword() {
            const pwd = document.getElementById('pwd-input').value;
            if (!pwd) { document.getElementById('pwd-input').focus(); return; }

            const btn = document.getElementById('pwd-btn');
            btn.disabled = true;
            btn.textContent = 'Vérification...';

            const result = await revealSecret(pwd);
            if (result === 'wrong_password') {
                document.getElementById('pwd-error').style.display = '';
                document.getElementById('pwd-input').style.borderColor = 'var(--red)';
                btn.disabled = false;
                btn.textContent = 'Révéler le secret';
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !document.getElementById('password-view').classList.contains('hidden')) {
                revealWithPassword();
            }
        });

        function copySecret() {
            navigator.clipboard.writeText(document.getElementById('secret-content').textContent);
            const btn = document.getElementById('copy-secret');
            btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M20 6 9 17l-5-5"/></svg> Copié !';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copier';
                btn.classList.remove('copied');
            }, 2000);
        }

        init();
    </script>
</body>
</html>
